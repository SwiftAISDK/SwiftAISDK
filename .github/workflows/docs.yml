name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [all, docs]
        default: all
permissions:
  contents: read
concurrency:
  group: swiftai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
      docs: ${{ steps.plan.outputs.docs }}
      packages: ${{ steps.plan.outputs.packages }}
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select checks
        id: plan
        run: node Scripts/ci-plan.cjs
  tooling:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check catalog and tooling
        run: |
          node Scripts/sdk.mjs generate --check
          node --test Scripts/tests/*.test.cjs
  test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Swift version
        run: swift --version | grep 'Swift version 6.3.3'
      - name: Test affected packages and compatibility facade once
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: node Scripts/test-packages.mjs --packages "$PACKAGES"
      - name: Compile for iOS
        run: node Scripts/sdk.mjs dev build --triple arm64-apple-ios15.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path .build/ios-verification
      - name: Build examples
        run: node Scripts/sdk.mjs dev examples build
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --prefix docs-site
      # API pages are committed with Swift API changes. Publishing prose needs no Swift build.
      - name: Generate documentation
        run: npm --prefix docs-site run generate -- --skip-reference
        env:
          DOCS_BASE: /SwiftAISDK
          DOCS_SITE: https://swiftaisdk.github.io
      - name: Check and build documentation
        working-directory: docs-site
        run: |
          npm exec -- astro check
          npm exec -- astro build
        env:
          DOCS_BASE: /SwiftAISDK
          DOCS_SITE: https://swiftaisdk.github.io
      - name: Upload documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist
          retention-days: 1
  deploy:
    needs: [changes, tooling, test, docs]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' && needs.docs.result == 'success' &&
      (needs.tooling.result == 'success' || needs.tooling.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
